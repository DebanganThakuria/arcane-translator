<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Arcane Translator</title>
		<meta
			name="description"
			content="Read Chinese, Korean, and Japanese webnovels translated into English."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Apply the saved chrome theme before first paint so the page never
			// flashes the wrong ground colour.
			try {
				const saved = localStorage.getItem('arcane:theme');
				const mode =
					saved === 'light' || saved === 'dark'
						? saved
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = mode;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
